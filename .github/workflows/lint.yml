# Lint PHP across the PHP versions supported by Nextcloud 33-35 and validate
# appinfo/info.xml against the App Store schema.
# Based on the Nextcloud templates lint-php.yml and lint-info-xml.yml
# (https://github.com/nextcloud/.github/tree/master/workflow-templates).

name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Nextcloud 33/34: PHP 8.2-8.5, Nextcloud 35: PHP 8.3-8.5 (lib/versioncheck.php)
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    name: php-lint ${{ matrix.php-versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: find appinfo lib templates -name '*.php' -print0 | xargs -0 -n1 php -l

  info-xml-lint:
    runs-on: ubuntu-latest

    name: info.xml lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            appinfo/

      - name: Download schema
        run: wget https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd

      - name: Lint info.xml
        uses: ChristophWurst/xmllint-action@36f2a302f84f8c83fceea0b9c59e1eb4a616d3c1 # v1.2
        with:
          xml-file: ./appinfo/info.xml
          xml-schema-file: ./info.xsd
