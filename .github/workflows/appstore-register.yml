# One-time registration of the app id on apps.nextcloud.com (and certificate
# renewal later on). Run manually once Nextcloud has signed the certificate:
# Actions > Register app in App Store > Run workflow.
#
# Re-running with a NEW certificate replaces it in the store and invalidates
# all previous releases (see the App Store REST API docs).

name: Register app in App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'phyti1'
    env:
      APP_NAME: lineup
    steps:
      - name: Fetch signed certificate
        run: |
          curl -fsSL -o app.crt \
            "https://raw.githubusercontent.com/nextcloud/app-certificate-requests/master/${APP_NAME}/${APP_NAME}.crt"
          openssl x509 -in app.crt -noout -subject

      - name: Sign app id
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APP_PRIVATE_KEY" > app.key
          chmod 600 app.key
          # Key must belong to the certificate, otherwise the store rejects it.
          test "$(openssl x509 -in app.crt -noout -pubkey)" = "$(openssl pkey -in app.key -pubout)"
          echo -n "$APP_NAME" | openssl dgst -sha512 -sign app.key | openssl base64 -A > app.sig
          rm -f app.key

      - name: Register in App Store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          jq -n --rawfile certificate app.crt --rawfile signature app.sig \
            '{certificate: $certificate, signature: ($signature | rtrimstr("\n")), is_enterprise_only: false}' > body.json
          status=$(curl -s -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Token $APPSTORE_TOKEN" \
            -H "Content-Type: application/json" \
            --data @body.json https://apps.nextcloud.com/api/v1/apps)
          cat response.txt; echo
          echo "HTTP $status"
          case "$status" in 201|204) ;; *) exit 1 ;; esac
